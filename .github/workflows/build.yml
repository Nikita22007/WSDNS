name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-jar:
    name: Build Fat JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Set version from tag
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "PROJECT_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "PROJECT_VERSION=1.0.0" >> $GITHUB_ENV
          fi

      - name: Build Shadow JAR
        run: ./gradlew :app:shadowJar --no-daemon

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsdns-all-jar
          path: app/build/libs/*-all.jar

  build-native:
    name: Build Native on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm64
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@v4
      
      - name: Set version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "PROJECT_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "PROJECT_VERSION=1.0.0" >> $GITHUB_ENV
          fi

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build Native Image
        run: ./gradlew :app:nativeCompile --no-daemon

      - name: Prepare Assets
        shell: bash
        run: |
          mkdir -p assets
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp app/build/native/nativeCompile/wsdns.exe assets/wsdns-windows-x86_64.exe
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            cp app/build/native/nativeCompile/wsdns assets/wsdns-linux-x86_64
          elif [ "${{ matrix.os }}" == "ubuntu-24.04-arm64" ]; then
            cp app/build/native/nativeCompile/wsdns assets/wsdns-linux-arm64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            cp app/build/native/nativeCompile/wsdns assets/wsdns-macos-arm64
          elif [ "${{ matrix.os }}" == "macos-13" ]; then
            cp app/build/native/nativeCompile/wsdns assets/wsdns-macos-x86_64
          fi

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsdns-native-${{ matrix.os }}-${{ matrix.arch }}
          path: assets/*

  release:
    name: Create Release
    needs: [build-jar, build-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/wsdns-*
          generate_release_notes: true
          draft: false
          prerelease: false
