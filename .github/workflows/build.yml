name: Build Project

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-jar:
    name: Build Fat JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Shadow JAR
        run: ./gradlew :app:shadowJar --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wsdns-all-jar
          path: app/build/libs/*-all.jar

  build-native:
    name: Build Native on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Native Image
        run: ./gradlew :app:nativeCompile --no-daemon
      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsdns-native-${{ matrix.os }}
          path: |
            app/build/native/nativeCompile/wsdns
            app/build/native/nativeCompile/wsdns.exe
